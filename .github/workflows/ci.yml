name: ci
on: [push, pull_request]
jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: gcc -std=c99 -Wall -Wextra -o t test/test_core.c -lm && ./t
  esphome-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install esphome
      - run: esphome config example.yaml && esphome config example-single-shot.yaml
